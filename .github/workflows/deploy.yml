name: Deploy to GCP

on:
  push:
    branches:
      - production

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy to GCP
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o StrictHostKeyChecking=no \
            deployer@${{ secrets.GCP_HOST }} bash << 'ENDSSH'
              set -e
              cd /appl
              git pull origin production
              npm install --production
              pm2 describe bongo-api > /dev/null 2>&1 \
                && pm2 restart bongo-api \
                || pm2 start server.js --name bongo-api
              pm2 save
              echo "Deployed successfully!"