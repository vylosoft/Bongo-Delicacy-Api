name: Deploy to GCP

on:
push:
branches:
- production

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup SSH
    run: |
      mkdir -p ~/.ssh
      echo "${{ secrets.GCP_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
      chmod 600 ~/.ssh/deploy_key

  - name: Add GCP Host
    run: |
      ssh-keyscan -H ${{ secrets.GCP_HOST }} >> ~/.ssh/known_hosts

  - name: Ensure target directory exists
    run: |
      ssh -i ~/.ssh/deploy_key deployer@${{ secrets.GCP_HOST }} "
        sudo mkdir -p /appl &&
        sudo chown -R deployer:deployer /appl
      "

  - name: Deploy files
    run: |
      rsync -rz \
        --delete \
        --omit-dir-times \
        --no-times \
        --no-owner \
        --no-group \
        --no-perms \
        --exclude=node_modules \
        --exclude=.git \
        --exclude=.github \
        --exclude=.env \
        -e "ssh -i ~/.ssh/deploy_key" \
        ./ deployer@${{ secrets.GCP_HOST }}:/appl/

  - name: Install dependencies and restart backend
    run: |
      ssh -i ~/.ssh/deploy_key deployer@${{ secrets.GCP_HOST }} << 'EOF'

      set -e

      export NVM_DIR="/home/deployer/.nvm"

      if [ -f "$NVM_DIR/nvm.sh" ]; then
        source "$NVM_DIR/nvm.sh"
      fi

      cd /appl

      echo "Node Version:"
      node -v

      echo "NPM Version:"
      npm -v

      npm install --production

      if pm2 describe bongo-api > /dev/null 2>&1; then
        echo "Restarting existing app..."
        pm2 restart bongo-api
      else
        echo "Starting new app..."
        pm2 start server.js --name bongo-api
      fi

      pm2 save

      echo "Deployment completed successfully"

      EOF
